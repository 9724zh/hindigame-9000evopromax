<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;700&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03030b;
    color: #dffaff;
    font-family: 'Rajdhani', sans-serif;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0.18;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      #80ffff18 4px
    );
  }

  #game {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  #hud, #message {
    position: fixed;
    z-index: 3;
    color: #b9ffff;
    background: linear-gradient(135deg, #071421dd, #160a26dd);
    border: 1px solid #34eaffaa;
    box-shadow: 0 0 18px #00d9ff55, inset 0 0 15px #8e00ff22;
    clip-path: polygon(0 0, 95% 0, 100% 18%, 100% 100%, 5% 100%, 0 82%);
    text-shadow: 0 0 8px #00faff;
    line-height: 1.6;
  }

  #hud {
    top: 16px;
    left: 16px;
    padding: 14px 20px;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  #message {
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: min(620px, calc(100% - 32px));
    padding: 16px 20px;
    text-align: center;
    font-size: 19px;
    font-weight: 700;
    animation: pulse 2s infinite alternate;
  }

  @keyframes pulse {
    from { box-shadow: 0 0 12px #00d9ff44, inset 0 0 10px #8e00ff22; }
    to   { box-shadow: 0 0 28px #00d9ffaa, inset 0 0 22px #8e00ff55; }
  }
</style>
